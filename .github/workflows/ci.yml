name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: xcode-27
    env:
      # Otherwise build.sh and test.sh would pick the runner's Command Line Tools.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - run: ./build.sh
      - run: ./test.sh
